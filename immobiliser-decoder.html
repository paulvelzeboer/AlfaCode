<title>Immobiliser Decoder</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
  /* Layout: single column — input card on top, result readout below, diagnostic-tool feel */
  :root {
    --bg: #eef1f0;
    --panel: #ffffff;
    --ink: #1a211f;
    --muted: #5e6a66;
    --line: #d4dbd8;
    --accent: #0a7d55;      /* diagnostic green */
    --accent-soft: #0a7d5518;
    --amber: #b06a00;
    --bad: #c0392b;
    --mono: "Roboto Mono", ui-monospace, "SF Mono", Menlo, monospace;
    --sans: "Inter", system-ui, -apple-system, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #101512;
      --panel: #19201c;
      --ink: #e7ece9;
      --muted: #94a099;
      --line: #2a332e;
      --accent: #3ad68f;
      --accent-soft: #3ad68f1f;
      --amber: #e0a550;
      --bad: #f06a5a;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #101512;
    --panel: #19201c;
    --ink: #e7ece9;
    --muted: #94a099;
    --line: #2a332e;
    --accent: #3ad68f;
    --accent-soft: #3ad68f1f;
    --amber: #e0a550;
    --bad: #f06a5a;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    line-height: 1.5;
  }
  .wrap {
    max-width: 640px;
    margin: 0 auto;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 28px 40px;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }
  header h1 {
    font-size: 1.5rem;
    margin: 0 0 4px;
    text-wrap: balance;
    letter-spacing: -0.01em;
  }
  header p { margin: 0; color: var(--muted); font-size: 0.9rem; }
  .card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 18px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  label {
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--muted);
    font-weight: 600;
  }
  textarea {
    width: 100%;
    min-width: 0;
    font-family: var(--mono);
    font-size: 1rem;
    padding: 12px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--bg);
    color: var(--ink);
    resize: vertical;
    min-height: 54px;
    letter-spacing: 0.04em;
  }
  textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    font-family: var(--mono);
    font-size: 0.78rem;
    padding: 6px 10px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: transparent;
    color: var(--muted);
    cursor: pointer;
  }
  .chip:hover { border-color: var(--accent); color: var(--accent); }
  .chip b { color: var(--ink); font-weight: 600; }
  .chip.active { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
  .row-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .btn {
    font-family: var(--sans);
    font-size: 0.78rem;
    font-weight: 600;
    padding: 7px 13px;
    border: 1px solid var(--accent);
    border-radius: 8px;
    background: var(--accent-soft);
    color: var(--accent);
    cursor: pointer;
  }
  .btn:hover { background: var(--accent); color: var(--panel); }
  .drop { border-color: var(--accent); background: var(--accent-soft); }
  .filenote { color: var(--muted); font-size: 0.78rem; }
  .result { gap: 18px; }
  .err { color: var(--bad); font-family: var(--mono); font-size: 0.9rem; }
  .row { display: flex; flex-direction: column; gap: 6px; }
  .big {
    font-family: var(--mono);
    font-size: 2rem;
    font-weight: 600;
    letter-spacing: 0.12em;
    color: var(--accent);
    font-variant-numeric: tabular-nums;
  }
  .status {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    font-size: 0.82rem;
    font-weight: 600;
    font-family: var(--mono);
  }
  .status::before {
    content: "";
    width: 9px; height: 9px;
    border-radius: 50%;
    background: currentColor;
  }
  .ok { color: var(--accent); }
  .warn { color: var(--amber); }
  .fail { color: var(--bad); }
  .cs { font-family: var(--mono); font-size: 1.15rem; font-weight: 600; letter-spacing: 0.08em; }
  table { width: 100%; border-collapse: collapse; font-family: var(--mono); font-size: 0.82rem; }
  .tablewrap { overflow-x: auto; }
  th, td { padding: 5px 8px; text-align: center; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th { color: var(--muted); font-weight: 500; font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.05em; }
  td.pin { color: var(--accent); font-weight: 700; }
  .divider { height: 1px; background: var(--line); border: 0; margin: 0; }
  .hint { color: var(--muted); font-size: 0.78rem; }
  .mono { font-family: var(--mono); }
</style>

<div class="wrap">
  <header>
    <h1>Immobiliser Decoder</h1>
    <p>Paste a transponder dump line — it recovers the PIN and verifies the two checksum bytes.</p>
  </header>

  <div class="card">
    <div class="row">
      <div class="row-head">
        <label for="dump">Transponder dump</label>
        <button class="btn" type="button" id="loadbtn">Load .bin file</button>
        <input type="file" id="file" accept=".bin,application/octet-stream" hidden>
      </div>
      <textarea id="dump" spellcheck="false" autocomplete="off"
        placeholder="80 21 2C E6 11 4A 41 6D 9C 63">80 21 2C E6 11 4A 41 6D 9C 63</textarea>
      <div class="filenote" id="filenote" hidden></div>
    </div>
    <div class="row" id="filekeysrow" hidden>
      <label>Keys found in file</label>
      <div class="chips" id="filekeys"></div>
    </div>
    <div class="row">
      <label>Examples</label>
      <div class="chips" id="chips"></div>
    </div>
  </div>

  <div class="card result" id="out"></div>
</div>

<script>
  const MASK = 0x0d;
  const HEADER = [0x80, 0x21, 0x2c];

  const examples = [
    { label: "Master", v: "80 21 2C E6 11 4A 41 6D 9C 63" },
    { label: "Slave", v: "80 21 2C 06 59 08 2E 45 31 CE" },
    { label: "145", v: "80 21 2C A3 86 83 FA 0E" },
    { label: "146", v: "80 21 2C 1E 2A 8E 04 59" },
  ];

  // nibble -> PIN digit: >9 subtract 9; original 0 becomes 7
  function mapNibble(n) {
    let v = n;
    if (v > 9) v -= 9;
    if (n === 0) v = 7;
    return v;
  }
  const hex2 = b => b.toString(16).toUpperCase().padStart(2, "0");

  function decode(raw) {
    const clean = (raw.match(/[0-9a-fA-F]/g) || []).join("");
    if (clean.length === 0) return { error: "Enter a dump line." };
    if (clean.length % 2 !== 0) return { error: "Odd number of hex digits — a byte is incomplete." };
    let bytes = [];
    for (let i = 0; i < clean.length; i += 2) bytes.push(parseInt(clean.slice(i, i + 2), 16));

    let header = false;
    if (bytes.length >= 3 && bytes[0] === HEADER[0] && bytes[1] === HEADER[1] && bytes[2] === HEADER[2]) {
      header = true;
      bytes = bytes.slice(3);
    }
    if (bytes.length < 5) return { error: "Need 5 key bytes after the 80 21 2C header." };

    const key = bytes.slice(0, 5);
    const given = bytes.slice(5, 7); // 0, 1, or 2 appended checksum bytes

    // PIN from the last 5 nibbles of the 5 key bytes
    const nibbles = key.flatMap(b => [b >> 4, b & 0x0f]);
    const pinNibbles = nibbles.slice(-5);
    const pinDigits = pinNibbles.map(mapNibble);
    const pin = pinDigits.join("");

    // Checksum: XOR of the 5 key bytes ^ 0x0D, then complement
    const cs1 = (key.reduce((a, b) => a ^ b, 0) ^ MASK) & 0xff;
    const cs2 = (~cs1) & 0xff;

    let check = null;
    if (given.length === 2) {
      const match = given[0] === cs1 && given[1] === cs2;
      check = { match, given };
    }

    return { header, key, pin, pinNibbles, pinDigits, cs1, cs2, check };
  }

  function render(raw) {
    const out = document.getElementById("out");
    const r = decode(raw);
    if (r.error) { out.innerHTML = `<div class="err">${r.error}</div>`; return; }

    const rows = r.pinNibbles.map((n, i) => {
      const d = n.toString(16).toUpperCase();
      let note = "—";
      if (n > 9) note = `${n} − 9`;
      else if (n === 0) note = "0 + 7";
      return `<tr><td>${d}</td><td>${n}</td><td>${note}</td><td class="pin">${r.pinDigits[i]}</td></tr>`;
    }).join("");

    let csStatus;
    if (r.check) {
      csStatus = r.check.match
        ? `<span class="status ok">Checksum valid</span>`
        : `<span class="status fail">Checksum mismatch — dump reads ${hex2(r.check.given[0])} ${hex2(r.check.given[1])}</span>`;
    } else {
      csStatus = `<span class="status warn">No checksum in dump — computed below</span>`;
    }

    out.innerHTML = `
      <div class="row">
        <label>Key bytes</label>
        <div class="mono">${r.key.map(hex2).join(" ")}${r.header ? '' : ' <span class="hint">(no 80 21 2C header found — read as 5 key bytes)</span>'}</div>
      </div>
      <hr class="divider">
      <div class="row">
        <label>Recovered PIN</label>
        <div class="big">${r.pin}</div>
      </div>
      <div class="tablewrap">
        <table>
          <thead><tr><th>Nibble</th><th>Dec</th><th>Rule</th><th>Digit</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
      <hr class="divider">
      <div class="row">
        <label>Checksum</label>
        <div class="cs">${hex2(r.cs1)} ${hex2(r.cs2)}</div>
        ${csStatus}
        <div class="hint">byte 1 = XOR of the 5 key bytes ⊕ 0x0D &nbsp;·&nbsp; byte 2 = ones' complement of byte 1</div>
      </div>`;
  }

  const ta = document.getElementById("dump");
  ta.addEventListener("input", () => render(ta.value));

  const chips = document.getElementById("chips");
  examples.forEach(ex => {
    const b = document.createElement("button");
    b.className = "chip";
    b.type = "button";
    b.innerHTML = `<b>${ex.label}</b> ${ex.v.replace("80 21 2C ", "")}`;
    b.addEventListener("click", () => { ta.value = ex.v; render(ex.v); ta.focus(); });
    chips.appendChild(b);
  });

  // Scan a .bin for every 80 21 2C record (header + 5 key + 2 checksum), dedup, keep order
  function scanBin(buf) {
    const b = new Uint8Array(buf);
    const seen = new Set();
    const records = [];
    for (let i = 0; i + 9 < b.length; i++) {
      if (b[i] === 0x80 && b[i + 1] === 0x21 && b[i + 2] === 0x2c) {
        const rec = Array.from(b.slice(i, i + 10)).map(hex2).join(" ");
        if (!seen.has(rec)) { seen.add(rec); records.push(rec); }
      }
    }
    return records;
  }

  const fileInput = document.getElementById("file");
  const fileNote = document.getElementById("filenote");
  const fileKeysRow = document.getElementById("filekeysrow");
  const fileKeys = document.getElementById("filekeys");

  function showFile(name, records) {
    if (records.length === 0) {
      fileNote.hidden = false;
      fileNote.textContent = `${name} — no 80 21 2C record found in this file.`;
      fileKeysRow.hidden = true;
      return;
    }
    fileNote.hidden = false;
    fileNote.textContent = records.length === 1
      ? `${name} — 1 key record found.`
      : `${name} — ${records.length} distinct key records found.`;

    fileKeys.innerHTML = "";
    if (records.length > 1) {
      fileKeysRow.hidden = false;
      records.forEach((rec, idx) => {
        const btn = document.createElement("button");
        btn.className = "chip";
        btn.type = "button";
        btn.textContent = rec;
        btn.addEventListener("click", () => {
          ta.value = rec; render(rec);
          [...fileKeys.children].forEach(c => c.classList.remove("active"));
          btn.classList.add("active");
        });
        fileKeys.appendChild(btn);
        if (idx === 0) btn.classList.add("active");
      });
    } else {
      fileKeysRow.hidden = true;
    }
    ta.value = records[0];
    render(records[0]);
  }

  function loadFile(file) {
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => showFile(file.name, scanBin(reader.result));
    reader.onerror = () => { fileNote.hidden = false; fileNote.textContent = `Could not read ${file.name}.`; };
    reader.readAsArrayBuffer(file);
  }

  document.getElementById("loadbtn").addEventListener("click", () => fileInput.click());
  fileInput.addEventListener("change", () => loadFile(fileInput.files[0]));

  const card = ta.closest(".card");
  ["dragenter", "dragover"].forEach(ev =>
    card.addEventListener(ev, e => { e.preventDefault(); card.classList.add("drop"); }));
  ["dragleave", "drop"].forEach(ev =>
    card.addEventListener(ev, e => { e.preventDefault(); card.classList.remove("drop"); }));
  card.addEventListener("drop", e => { if (e.dataTransfer.files.length) loadFile(e.dataTransfer.files[0]); });

  render(ta.value);
</script>
